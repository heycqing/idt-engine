name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # tsx 依赖 esbuild 的 install 脚本放置原生二进制，pnpm 10 默认拦截，
      # 靠 pnpm-workspace.yaml 的 allowBuilds 放行。拦住的话下面两步都跑不起来。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # 单测不访问网络、不启动浏览器、不调模型，所以不装 Playwright 浏览器。
      - name: Unit tests
        run: pnpm test:idt
